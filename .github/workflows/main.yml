name: Build VinylTracklist (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: ${{ matrix.arch }}
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build exe
        run: pyinstaller --noconfirm --clean VinylTracklist.spec
      - uses: actions/upload-artifact@v4
        with:
          name: VinylTracklist-windows-${{ matrix.arch }}
          path: dist/VinylTracklist.exe
